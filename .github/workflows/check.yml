name: Comprobar resultados JQCV

on:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 08:00 UTC.
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: vigilar; preview: ver la lista; test-email: probar SMTP'
        required: true
        default: check
        type: choice
        options:
          - check
          - preview
          - test-email

permissions:
  contents: write

concurrency:
  group: jqcv-results
  cancel-in-progress: false

jobs:
  check:
    # Ejecuta el monitor únicamente desde la rama predeterminada.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar la lista o ejecutar una prueba manual
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          RESULTS_SELECTOR: ${{ vars.RESULTS_SELECTOR || 'ul.list-group.show-quick-actions-on-hover' }}
          MODE: ${{ inputs.mode || 'check' }}
          PYTHONUNBUFFERED: '1'
        run: |
          case "$MODE" in
            check) python check_results.py ;;
            preview) python check_results.py --dry-run ;;
            test-email) python check_results.py --test-email ;;
            *) echo "Modo desconocido" >&2; exit 1 ;;
          esac

      - name: Guardar el nuevo estado si ha cambiado
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f last_content.txt ]; then
            echo "No hay estado que guardar."
            exit 0
          fi
          git add -- last_content.txt
          if git diff --cached --quiet -- last_content.txt; then
            echo "El estado no ha cambiado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar estado de resultados JQCV"
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
          done
          echo "No se pudo guardar el estado en GitHub." >&2
          exit 1
